# kitty.conf
# Основано на дефолтном шаблоне kitty; здесь оставлены только реальные
# отличия от дефолта. Полный шаблон со всеми опциями и комментариями
# можно сгенерировать заново командой:
#   kitty +runpy 'from kitty.config import *; print(defconf)' > kitty.conf
# либо взять из официальной документации: https://sw.kovidgoyal.net/kitty/conf/

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
